<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96" role="img" aria-label="2D Material Layout Planner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b7cf5"/>
      <stop offset="100%" stop-color="#2f6feb"/>
    </linearGradient>
  </defs>

  <!-- Icon mark -->
  <g transform="translate(8 8)">
    <rect x="0" y="0" width="80" height="80" rx="18" fill="url(#bg)"/>
    <g fill="#ffffff">
      <rect x="11" y="16" width="23" height="12" rx="2"/>
      <rect x="36" y="16" width="33" height="12" rx="2"/>
      <rect x="11" y="30" width="36" height="12" rx="2"/>
      <rect x="49" y="30" width="20" height="12" rx="2"/>
      <rect x="11" y="44" width="17" height="12" rx="2"/>
      <rect x="30" y="44" width="39" height="12" rx="2"/>
    </g>
    <rect x="49" y="30" width="20" height="12" rx="2" fill="#ffd166"/>
    <rect x="11" y="62" width="58" height="3" rx="1.5" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#0b1220">
    <text x="104" y="46" font-size="24" font-weight="700" letter-spacing="-0.5">Material Layout</text>
    <text x="104" y="74" font-size="20" font-weight="500" fill="#5b6472" letter-spacing="-0.2">Planner</text>
  </g>
