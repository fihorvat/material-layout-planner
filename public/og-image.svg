<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="2D Material Layout Planner">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3f5f8"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b7cf5"/>
      <stop offset="100%" stop-color="#2f6feb"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#e6e8ec" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#page)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Icon -->
  <g transform="translate(80 175)">
    <rect width="280" height="280" rx="56" fill="url(#brand)"/>
    <g fill="#ffffff" transform="translate(40 56)">
      <rect x="0"   y="0"  width="82"  height="44" rx="6"/>
      <rect x="88"  y="0"  width="114" height="44" rx="6"/>
      <rect x="0"   y="50" width="126" height="44" rx="6"/>
      <rect x="132" y="50" width="70"  height="44" rx="6"/>
      <rect x="0"   y="100" width="60" height="44" rx="6"/>
      <rect x="66"  y="100" width="136" height="44" rx="6"/>
    </g>
    <rect x="172" y="106" width="70" height="44" rx="6" fill="#ffd166"/>
    <rect x="40" y="216" width="200" height="6" rx="3" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Text -->
  <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#0b1220">
    <text x="410" y="260" font-size="72" font-weight="800" letter-spacing="-2">Material Layout</text>
    <text x="410" y="340" font-size="72" font-weight="800" letter-spacing="-2" fill="#2f6feb">Planner</text>
    <text x="410" y="408" font-size="28" font-weight="500" fill="#5b6472">Plan 2D material layouts, cut lists, and waste —</text>
    <text x="410" y="446" font-size="28" font-weight="500" fill="#5b6472">all in your browser. No server. No cloud.</text>

    <!-- Feature chips -->
    <g font-size="20" font-weight="600">
      <g transform="translate(410 490)">
        <rect width="190" height="44" rx="22" fill="#e6efff"/>
        <text x="95" y="29" text-anchor="middle" fill="#2f6feb">Cut lists</text>
      </g>
      <g transform="translate(610 490)">
        <rect width="210" height="44" rx="22" fill="#e6efff"/>
        <text x="105" y="29" text-anchor="middle" fill="#2f6feb">PDF export</text>
      </g>
      <g transform="translate(830 490)">
        <rect width="240" height="44" rx="22" fill="#e6efff"/>
        <text x="120" y="29" text-anchor="middle" fill="#2f6feb">Offline-first</text>
      </g>
    </g>
  </g>
</svg>
