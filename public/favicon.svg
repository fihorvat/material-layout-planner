<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Material Layout Planner">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b7cf5"/>
      <stop offset="100%" stop-color="#2f6feb"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="32" height="32" rx="7" ry="7" fill="url(#g)"/>
  <!-- Running-bond tile pattern -->
  <g fill="#ffffff">
    <rect x="5"  y="6"  width="9"  height="5" rx="1"/>
    <rect x="15" y="6"  width="12" height="5" rx="1"/>
    <rect x="5"  y="12" width="14" height="5" rx="1"/>
    <rect x="20" y="12" width="7"  height="5" rx="1"/>
    <rect x="5"  y="18" width="7"  height="5" rx="1"/>
    <rect x="13" y="18" width="14" height="5" rx="1"/>
  </g>
  <!-- Cut indicator -->
  <rect x="5" y="24" width="22" height="2" rx="1" fill="#ffd166" opacity="0.95"/>
</svg>
